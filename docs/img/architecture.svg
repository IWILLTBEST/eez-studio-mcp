<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7A8499"/>
    </marker>
  </defs>
  <rect width="880" height="420" fill="#0D1117"/>
  <text x="440" y="34" text-anchor="middle" fill="#E6EDF3" font-size="17" font-weight="600">eez-studio-mcp architecture</text>

  <!-- MCP 客户端 -->
  <rect x="30" y="70" width="200" height="96" rx="10" fill="#161B22" stroke="#2E86DE" stroke-width="1.5"/>
  <text x="130" y="102" text-anchor="middle" fill="#E6EDF3" font-size="14" font-weight="600">MCP Client</text>
  <text x="130" y="124" text-anchor="middle" fill="#8B949E" font-size="11">Claude / Cursor / ZCode</text>
  <text x="130" y="142" text-anchor="middle" fill="#8B949E" font-size="11">DSH / any MCP host</text>

  <!-- MCP server -->
  <rect x="30" y="230" width="200" height="96" rx="10" fill="#161B22" stroke="#2E86DE" stroke-width="1.5"/>
  <text x="130" y="260" text-anchor="middle" fill="#E6EDF3" font-size="14" font-weight="600">eez_mcp_server.py</text>
  <text x="130" y="282" text-anchor="middle" fill="#8B949E" font-size="11">45 tools · live resources</text>
  <text x="130" y="300" text-anchor="middle" fill="#8B949E" font-size="11">progress notifications</text>

  <!-- EEZ Studio -->
  <rect x="560" y="70" width="290" height="256" rx="10" fill="#161B22" stroke="#27AE60" stroke-width="1.5"/>
  <text x="705" y="100" text-anchor="middle" fill="#E6EDF3" font-size="14" font-weight="600">EEZ Studio (patched fork)</text>
  <text x="705" y="120" text-anchor="middle" fill="#8B949E" font-size="11">github.com/IWILLTBEST/studio · GPL-3.0</text>
  <rect x="585" y="140" width="240" height="52" rx="8" fill="#0D1117" stroke="#30363D"/>
  <text x="705" y="161" text-anchor="middle" fill="#E6EDF3" font-size="12">ai-agent bridge (main process)</text>
  <text x="705" y="179" text-anchor="middle" fill="#8B949E" font-size="11">HTTP 127.0.0.1:17620</text>
  <rect x="585" y="205" width="240" height="52" rx="8" fill="#0D1117" stroke="#30363D"/>
  <text x="705" y="226" text-anchor="middle" fill="#E6EDF3" font-size="12">dispatcher + tools (renderer)</text>
  <text x="705" y="244" text-anchor="middle" fill="#8B949E" font-size="11">widget CRUD · styles · debugger</text>
  <rect x="585" y="270" width="240" height="40" rx="8" fill="#0D1117" stroke="#30363D"/>
  <text x="705" y="295" text-anchor="middle" fill="#E6EDF3" font-size="12">LVGL editor + wasm simulator</text>

  <!-- IR compiler branch -->
  <rect x="330" y="70" width="170" height="96" rx="10" fill="#161B22" stroke="#F6B93B" stroke-width="1.5"/>
  <text x="415" y="100" text-anchor="middle" fill="#E6EDF3" font-size="14" font-weight="600">ir2eez.py</text>
  <text x="415" y="122" text-anchor="middle" fill="#8B949E" font-size="11">IR JSON → .eez-project</text>
  <text x="415" y="140" text-anchor="middle" fill="#8B949E" font-size="11">+ action.h (firmware)</text>

  <rect x="330" y="230" width="170" height="96" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <text x="415" y="260" text-anchor="middle" fill="#E6EDF3" font-size="14" font-weight="600">Outputs</text>
  <text x="415" y="282" text-anchor="middle" fill="#8B949E" font-size="11">.eez-project · action.h</text>
  <text x="415" y="300" text-anchor="middle" fill="#8B949E" font-size="11">fonts (OFL subsets)</text>

  <!-- 连线 -->
  <line x1="130" y1="166" x2="130" y2="230" stroke="#7A8499" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="145" y="203" fill="#8B949E" font-size="10">MCP (stdio)</text>

  <line x1="230" y1="278" x2="560" y2="170" stroke="#7A8499" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="330" y="212" fill="#8B949E" font-size="10">HTTP POST /tool</text>

  <line x1="415" y1="166" x2="600" y2="140" stroke="#7A8499" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <text x="440" y="132" fill="#8B949E" font-size="10">open project</text>

  <line x1="415" y1="166" x2="415" y2="230" stroke="#7A8499" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="428" y="205" fill="#8B949E" font-size="10">compile</text>

  <!-- 底部说明 -->
  <text x="440" y="372" text-anchor="middle" fill="#8B949E" font-size="11">UI state lives in EEZ Studio · the MCP layer is pure Python · firmware talks to the UI via bound variables + native actions (action.h)</text>
  <text x="440" y="396" text-anchor="middle" fill="#8B949E" font-size="11">tool outputs (generated projects, action.h) are yours — not GPL-covered, same as GCC output</text>
</svg>
